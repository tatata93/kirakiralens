[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kirakiralens"
version = "0.1.0"
description = "Diagram-first photographic lens design using catalog optics and Optiland"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1,<4",
  "optiland==0.5.9",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
kirakiralens = "kirakiralens.__main__:main"
kirakiralens-import-edmund = "kirakiralens.catalog.edmund:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
